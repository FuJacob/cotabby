name: CoHamster
options:
  bundleIdPrefix: org.mchamster
  defaultConfig: Release
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top
  xcodeVersion: "2600"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.1
  CotabbyInference:
    url: https://github.com/FuJacob/cotabbyinference.git
    branch: main
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.12.1
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: 1.1.0
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MTL_FAST_MATH: YES
    SDKROOT: macosx
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS:
        - DEBUG=1
        - $(inherited)
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
# Signing lives in xcconfig files, not the generated project. `Config/Signing.xcconfig` (committed)
# supplies CoHamster's team as the maintainer-friendly default and optionally includes the gitignored
# `Config/Signing.local.xcconfig` that `scripts/dev-setup.sh` writes for contributors on another
# team. It sits in a subdirectory on purpose: a root-level config file makes XcodeGen name a group
# after the checkout directory, which drifts between clones and CI. DEVELOPMENT_TEAM must also stay
# out of the build settings above: project/target settings outrank an xcconfig and would prevent the
# local override from winning.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
# Both products share the same source module. The release keeps the previous fork bundle ID
# and data directory so a product rename does not reset preferences, credentials, or model storage.
# The dev identity remains separate from the installed release.
targetTemplates:
  CotabbyApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Cotabby
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: CotabbyInference
        product: CotabbyInference
      - package: swift-log
        product: InMemoryLogging
      - package: swift-log
        product: Logging
      - package: LaunchAtLogin
        product: LaunchAtLogin
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY[sdk=macosx*]: Apple Development
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/CoHamsterInfo.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_MODULE_NAME: Cotabby
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
targets:
  CoHamster:
    templates:
      - CotabbyApp
    settings:
      base:
        # Compatibility identity from the existing fork; this is not a display name.
        PRODUCT_BUNDLE_IDENTIFIER: org.mchamster.cotabby
        COHAMSTER_DATA_DIRECTORY: Cotabby McHamster
  "CoHamster Dev":
    templates:
      - CotabbyApp
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        PRODUCT_BUNDLE_IDENTIFIER: "$(COHAMSTER_DEV_BUNDLE_ID:default=org.mchamster.cohamster.dev)"
        COHAMSTER_DATA_DIRECTORY: CoHamster Dev
  CotabbyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CotabbyTests
    dependencies:
      - target: CoHamster
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: org.mchamster.cohamster.tests
        PRODUCT_MODULE_NAME: $(TARGET_NAME)
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: macosx
        SWIFT_OBJC_INTEROP_MODE: objcxx
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CoHamster.app/Contents/MacOS/CoHamster
schemes:
  CoHamster:
    build:
      targets:
        CoHamster: all
    run:
      config: Debug
      commandLineArguments:
        -cotabby-debug: true
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CotabbyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  "CoHamster Dev":
    build:
      targets:
        "CoHamster Dev": all
    run:
      config: Debug
      commandLineArguments:
        -cotabby-debug: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
